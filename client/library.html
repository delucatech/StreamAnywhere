<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>StreamAnywhere – Library</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/src/library/library.css" />
  </head>
  <body class="lib-body">
    <!-- Opened from the home screen: the launcher's zoom splash continues here (feed.html does the same). -->
    <div id="splash" class="splash hidden" aria-hidden="true">
      <div id="splashIcon" class="splash-icon"></div>
    </div>
    <script>
      try {
        var launch = JSON.parse(sessionStorage.getItem('streamanywhere.launch') || 'null');
        sessionStorage.removeItem('streamanywhere.launch');
        if (launch && launch.tile && launch.icon) {
          var splash = document.getElementById('splash');
          splash.style.background = launch.tile;
          document.getElementById('splashIcon').innerHTML = launch.icon;
          splash.classList.remove('hidden');
        }
      } catch (e) {
        /* no splash */
      }
    </script>

    <div class="wallpaper" aria-hidden="true"></div>

    <div class="page" id="page">
      <header class="topbar">
        <a id="homeLink" class="top-icon" href="home.html" aria-label="Home" title="Home">
          <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="currentColor" d="M12 3.2 2.8 11.4l1.3 1.5L5.5 11.7V20a1 1 0 0 0 1 1h4v-6h3v6h4a1 1 0 0 0 1-1v-8.3l1.4 1.2 1.3-1.5z" /></svg>
        </a>
        <h1 class="title"><span class="title-icon" id="titleIcon" aria-hidden="true"></span>Library</h1>
        <span class="top-group">
          <button type="button" id="addBtn" class="top-icon add" aria-label="Add a video link" aria-expanded="false" title="Add a video link">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          </button>
          <button type="button" id="catsBtn" class="top-icon" aria-label="Manage categories" title="Manage categories">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h18M3 12h12M3 17h8" /><circle cx="18" cy="16" r="3" /><path d="M20.5 18.5 22 20" /></svg>
          </button>
        </span>
      </header>

      <main class="card">
        <div class="addbox hidden" id="addBox">
          <form class="urlrow" id="saveForm" autocomplete="off">
            <input id="url" class="url" type="url" inputmode="url" placeholder="Paste a YouTube, TikTok, Instagram or Facebook link" spellcheck="false" required />
            <button type="button" id="pasteBtn" class="btn ghost" title="Paste from the clipboard">Paste</button>
            <button type="submit" id="saveBtn" class="btn primary">Save link</button>
          </form>
          <p class="hint" id="saveHint">Saving keeps the link and its details in your library on every device. Nothing is downloaded until you choose to, on the device you want it on.</p>
          <p class="status hidden" id="saveStatus" role="status"></p>
        </div>

        <div class="banner hidden" id="offline" role="status">You are offline. This is the library as last seen; only videos downloaded to this browser can play.</div>

        <div class="filters" id="filters">
          <input id="search" class="search" type="search" placeholder="Search titles, authors, sources" aria-label="Search the library" />
          <button type="button" id="localOnly" class="toggle" aria-pressed="false" title="Only videos downloaded to this browser">
            <span class="toggle-dot" aria-hidden="true"></span>On this browser
          </button>
        </div>
        <div class="chips" id="chips" role="radiogroup" aria-label="Category"></div>

        <section class="grid" id="grid" aria-live="polite"></section>
        <div class="empty hidden" id="empty"></div>
      </main>

      <footer class="storage" id="storage"></footer>
      <p class="foot" id="foot"></p>
    </div>

    <!-- one video: details, categories, downloads (filled by library.ts) -->
    <div class="overlay hidden" id="sheetOverlay">
      <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle">
        <div class="sh-head" id="shHead"></div>
        <div class="sh-body" id="shBody"></div>
      </div>
    </div>

    <!-- categories: create, rename, delete -->
    <div class="overlay hidden" id="catsOverlay">
      <div class="sheet small" role="dialog" aria-modal="true" aria-label="Categories">
        <div class="sh-head static">
          <h2 class="sh-h2">Categories</h2>
          <button type="button" class="sh-close" id="catsClose" aria-label="Close">✕</button>
        </div>
        <div class="sh-body" id="catsBody"></div>
      </div>
    </div>

    <div id="theater"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/src/library/library.ts"></script>
  </body>
</html>
