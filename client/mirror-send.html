<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07080c" />
    <title>Mirror sender – StreamAnywhere</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/mirror/mirror.css" />
    <style>
      body {
        overflow: auto;
      }
      main {
        max-width: 900px;
        margin: 0 auto;
        padding: 56px 16px 32px;
      }
      h1 {
        font-size: 26px;
        margin: 0 0 4px;
      }
      .sub {
        color: var(--muted);
        margin: 0 0 20px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 18px 20px;
        margin-bottom: 16px;
      }
      .roomcode {
        font: 700 44px/1 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        letter-spacing: 0.25em;
        margin: 6px 0 8px;
      }
      .card a {
        color: var(--accent);
        word-break: break-all;
      }
      .controls {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 12px 16px;
        align-items: end;
      }
      label {
        display: grid;
        gap: 6px;
        font-size: 14px;
        color: var(--muted);
      }
      select {
        font: inherit;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: #0c0e14;
        color: var(--fg);
      }
      label.check {
        grid-auto-flow: column;
        justify-content: start;
        align-items: center;
        padding: 10px 0;
      }
      .buttons {
        display: flex;
        gap: 12px;
        margin-top: 16px;
      }
      .secondary {
        padding: 16px 26px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: #1b1f2b;
        color: var(--fg);
        font-weight: 600;
        font-size: 16px;
        cursor: pointer;
      }
      .secondary:disabled {
        opacity: 0.45;
        cursor: default;
      }
      #status,
      #watchers {
        margin-top: 12px;
        color: var(--muted);
      }
      #preview {
        width: 100%;
        max-height: 50vh;
        background: #000;
        border-radius: 12px;
        object-fit: contain;
      }
      #log {
        font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace;
        color: var(--muted);
        max-height: 240px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <a id="home" class="home" href="home.html">‹ Home</a>
    <main>
      <h1>Mirror sender</h1>
      <p class="sub">This computer's screen (or camera, or a test pattern) on the Tesla. The iPhone app does the same from a phone.</p>

      <div class="card">
        <div>Room code</div>
        <div id="room" class="roomcode">······</div>
        <div>Open on the Tesla: <a id="link" href="#"></a></div>
      </div>

      <div class="card">
        <div class="controls">
          <label>Source
            <select id="source">
              <option value="pattern">Test pattern</option>
              <option value="screen">This screen / a window</option>
              <option value="camera">Camera</option>
            </select>
          </label>
          <label>Longest side
            <select id="size">
              <option value="854">854 (480p)</option>
              <option value="1280" selected>1280 (720p)</option>
              <option value="1920">1920 (1080p)</option>
            </select>
          </label>
          <label>Frame rate
            <select id="fps">
              <option value="15">15</option>
              <option value="24">24</option>
              <option value="30" selected>30</option>
            </select>
          </label>
          <label>Bit rate
            <select id="bitrate">
              <option value="1500000">1.5 Mb/s</option>
              <option value="3000000" selected>3 Mb/s</option>
              <option value="6000000">6 Mb/s</option>
            </select>
          </label>
          <label class="check"><input id="audio" type="checkbox" checked /> Sound</label>
        </div>
        <div class="buttons">
          <button id="start" class="primary" type="button" disabled>Start</button>
          <button id="stop" class="secondary" type="button" disabled>Stop</button>
        </div>
        <div id="status">Getting a room…</div>
        <div id="watchers"></div>
      </div>

      <div class="card">
        <canvas id="preview" width="640" height="360"></canvas>
      </div>

      <div class="card"><div id="log"></div></div>
    </main>
    <script type="module" src="/src/mirror/send.ts"></script>
  </body>
</html>
