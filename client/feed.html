<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>StreamAnywhere – Feed</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/src/feed/feed.css" />
    <link rel="stylesheet" href="/src/feed/theater.css" />
  </head>
  <body class="feed-body">
    <!-- Opened from the home screen: the launcher's zoom splash continues here (same tile, same 150 px
         icon) from the very first paint, and feed.ts fades it out once the page is set up. -->
    <div id="splash" class="splash hidden" aria-hidden="true">
      <div id="splashIcon" class="splash-icon"></div>
      <div class="splash-status"><span class="splash-spinner"></span><span id="splashText"></span></div>
    </div>
    <script>
      try {
        var launch = JSON.parse(sessionStorage.getItem('streamanywhere.launch') || 'null');
        sessionStorage.removeItem('streamanywhere.launch');
        if (launch && launch.tile && launch.icon) {
          var splash = document.getElementById('splash');
          splash.style.background = launch.tile;
          document.getElementById('splashIcon').innerHTML = launch.icon;
          document.getElementById('splashText').textContent = 'Opening ' + launch.name + '…';
          splash.classList.remove('hidden');
        }
      } catch (e) {
        /* no splash */
      }
      // The page must never hang on "Opening …": if feed.ts has not finished setting up after 15 s
      // (its script did not load, or failed on this browser before it could report), the splash says
      // so, a tap reloads, and the server hears what this device saw (/api/log: "client problem: page stuck").
      // Errors are collected from here on, so even one thrown before feed.ts is running is known.
      var bootErrors = [];
      window.addEventListener(
        'error',
        function (e) {
          var t = e.target;
          var what = t && t !== window && (t.src || t.href) ? 'failed to load ' + (t.src || t.href) : (e.message || 'error') + ' @ ' + (e.filename || '?') + ':' + (e.lineno || 0);
          if (!window.streamAnywhereReady && bootErrors.length < 4) bootErrors.push(what);
        },
        true,
      );
      window.addEventListener('unhandledrejection', function (e) {
        if (!window.streamAnywhereReady && bootErrors.length < 4) bootErrors.push('rejection: ' + ((e.reason && e.reason.message) || e.reason));
      });
      setTimeout(function () {
        if (window.streamAnywhereReady) return;
        var platform = (location.search.match(/[?&]platform=([\w-]+)/) || [])[1] || '';
        var name = (launch && launch.name) || 'the app';
        try {
          fetch('/api/report', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            credentials: 'same-origin',
            keepalive: true,
            body: JSON.stringify({
              kind: 'page stuck',
              ok: false,
              connection: 'proxy',
              renderer: 'none',
              platform: platform || undefined,
              detail:
                'feed page not set up after 15 s: script ' + (window.streamAnywhereStarted ? 'started, did not finish' : 'never ran') +
                '; readyState ' + document.readyState + (bootErrors.length ? '; ' + bootErrors.join(' | ') : '; no error seen'),
              page: location.pathname + location.search,
              ua: navigator.userAgent,
            }),
          }).catch(function () {});
        } catch (e) {
          /* nothing to tell it with */
        }
        var s = document.getElementById('splash');
        if (!s) return;
        if (s.classList.contains('hidden')) {
          s.style.background = '#000';
          s.classList.remove('hidden');
        }
        s.classList.add('stuck');
        document.getElementById('splashText').textContent = 'Opening ' + name + ' is taking too long. Tap to try again.';
        s.addEventListener('click', function () {
          location.reload();
        });
      }, 15000);
    </script>
    <div id="app" class="app">
      <!-- Wide screens (the car): the left rail with the apps (the one in use is marked) and the sections.
           Phones use the top bar + bottom bar instead; the rail's buttons act through the same handlers. -->
      <nav class="rail" id="rail" aria-label="Apps and sections">
        <button class="rail-launcher" id="railLauncher" type="button" title="Home screen (all apps)" aria-label="Home screen (all apps)">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.6" /><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6" /><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6" /><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6" /></svg>
        </button>
        <div class="rail-rule" aria-hidden="true"></div>
        <div class="rail-heading" aria-hidden="true">APPS</div>
        <!-- one button per platform, filled in by feed.ts -->
        <div class="rail-apps" id="railApps"></div>
        <div class="rail-spacer"></div>
        <button class="rail-sec" id="railFriends" type="button" title="Coming later">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5" /><path d="M2.5 20c0-3.5 2.9-5.5 6.5-5.5s6.5 2 6.5 5.5" /><path d="M16 4.5a3.5 3.5 0 0 1 0 7" /><path d="M18 14.8c2.2.6 3.5 2.4 3.5 5.2" /></svg><span>Friends</span>
        </button>
        <button class="rail-sec" id="railInbox" type="button" title="Messages">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-9l-5 4v-4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z" /></svg><span>Inbox</span>
        </button>
        <button class="rail-sec" id="railProfile" type="button" title="Sign in / account">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4" /><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5" /></svg><span id="railProfileLabel">Profile</span>
        </button>
      </nav>

      <!-- transparent top bar over the video, like the app (wide screens: the header of the middle column) -->
      <header class="topbar" id="topbar">
        <a class="top-icon brand" id="homeLink" href="./home.html" title="Home screen (all apps)" aria-label="Home screen">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M3 3h8v8H3zm10 0h8v8h-8zM3 13h8v8H3zm10 0h8v8h-8z" /></svg>
        </a>
        <div class="app-title" id="appTitle"><span class="app-name" id="appName"></span><span class="app-sub" id="appSub"></span></div>
        <nav class="tabs" id="tabs" aria-label="Feed source">
          <button class="tab" data-source="explore" type="button">Explore</button>
          <button class="tab" data-source="foryou" type="button">For You</button>
        </nav>
        <button class="top-icon search-btn" id="searchBtn" type="button" title="Search (/)" aria-label="Search">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M10.5 4a6.5 6.5 0 1 1 0 13 6.5 6.5 0 0 1 0-13zm5.3 11.3L20 19.5" /></svg>
          <span class="search-label" id="searchLabel">Search</span>
        </button>
      </header>
      <div class="chips hidden" id="chips" aria-label="Explore categories"></div>
      <!-- what is playing when it is not a source: a search or an account's videos -->
      <div class="context hidden" id="context">
        <button id="contextBack" class="context-close" type="button" aria-label="Back to the list">←</button>
        <span id="contextLabel"></span>
        <button id="contextClose" class="context-close" type="button" aria-label="Back to the feed">✕</button>
      </div>

      <!-- The stage. Phones: both wrappers are display: contents, so the feed fills the screen as before.
           Wide screens: the feed is a 9:16 column of rounded panels with the edges of the previous / next
           videos showing above and below the one in view, and the actions beside it instead of over the picture.
           The feed is the clip; the track inside it holds every video panel and is moved by feed.ts
           (it follows the finger / mouse, then snaps). -->
      <div class="stage" id="stage">
        <div class="feed-col">
          <main id="feed" class="feed" tabindex="0" aria-label="Video feed"><div id="track" class="track"></div></main>
        </div>

        <!-- right-hand action column (acts on the video in view) -->
        <aside class="actions" id="actions">
          <!-- the avatar, with the follow "+" on its lower edge (TikTok's) while the signed-in account does not follow this one -->
          <div class="act-author">
            <button class="act" id="actAuthor" type="button" title="Who posted this video (P)"><span class="ico avatar"><img id="actAuthorImg" alt="" draggable="false" /></span><small id="actAuthorLabel">Profile</small></button>
            <button class="act-follow hidden" id="actFollow" type="button" title="Follow this account" aria-label="Follow this account"><span aria-hidden="true">+</span></button>
          </div>
          <!-- the video's counts (read-only): likes and comments -->
          <div class="act stat hidden" id="actLikes" title="Likes"><span class="ico"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 20.3l-1.2-1.1C5.9 14.8 3 12.1 3 8.9 3 6.3 5 4.3 7.6 4.3c1.5 0 2.9.7 3.9 1.8 1-1.1 2.4-1.8 3.9-1.8C18 4.3 20 6.3 20 8.9c0 3.2-2.9 5.9-7.8 10.3L12 20.3z" /></svg></span><small id="actLikesLabel"></small></div>
          <div class="act stat hidden" id="actComments" title="Comments"><span class="ico"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3.5c-5 0-9 3.3-9 7.4 0 2.3 1.3 4.4 3.3 5.8L5.5 20.5l4.2-1.8c.7.1 1.5.2 2.3.2 5 0 9-3.3 9-7.4s-4-7.5-9-7.5z" /></svg></span><small id="actCommentsLabel"></small></div>
          <button class="act" id="actMute" type="button" title="Sound on/off (M)"><span class="ico" id="actMuteIco"></span><small>Sound</small></button>
          <button class="act" id="actDownload" type="button" title="Save this video: to your library or to this device (D)"><span class="ico" id="actDownloadIco"></span><small>Save</small></button>
          <button class="act" id="actAuto" type="button" title="Auto-scroll to the next video when one ends (A)"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 6l9 6-9 6z" /><path d="M18 6v12" /></svg></span><small id="actAutoLabel">Auto</small></button>
          <button class="act" id="actSpeed" type="button" title="Playback speed (S)"><span class="ico" id="actSpeedIco">1×</span><small>Speed</small></button>
          <button class="act" id="actFull" type="button" title="Full screen (F)"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5" /><path d="M20 9V4h-5" /><path d="M4 15v5h5" /><path d="M20 15v5h-5" /></svg></span><small>Full</small></button>
        </aside>
      </div>

      <!-- Full screen (the Full action / F): the only control left over the video; leaves full screen -->
      <button class="fs-exit" id="fsExit" type="button" title="Exit full screen (F / Esc)" aria-label="Exit full screen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4v5H4" /><path d="M15 4v5h5" /><path d="M9 20v-5H4" /><path d="M15 20v-5h5" /></svg><span>Exit full screen</span>
      </button>

      <!-- Wide screens: the loaded videos as a queue around the one playing; tap a row to jump there. -->
      <aside class="upnext" id="upnext" aria-label="Up next">
        <div class="upnext-head">
          <span class="upnext-title">Up next</span>
          <button class="upnext-auto" id="upnextAuto" type="button" role="switch" aria-checked="true" title="Auto-scroll to the next video when one ends (A)"><i aria-hidden="true"></i>Auto-scroll</button>
        </div>
        <!-- The rows are filled in by feed.ts; the last one is the "loading more" status (never over the video). -->
        <div class="upnext-list" id="upnextList">
          <div class="q-status hidden" id="upnextStatus" role="status" aria-live="polite">
            <div class="spinner" aria-hidden="true"></div>
            <div class="q-status-text"><b id="upnextStatusTitle"></b><span id="upnextStatusDetail"></span></div>
          </div>
        </div>
      </aside>

      <!-- bottom bar with icons, like the app -->
      <nav class="bottombar" id="bottombar" aria-label="Main">
        <button class="nav active" id="navHome" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3 2 12h3v8h5v-6h4v6h5v-8h3z" /></svg><span>Home</span>
        </button>
        <button class="nav" id="navFriends" type="button" title="Coming later">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm7 1a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM1 20c0-3.3 3.6-6 8-6s8 2.7 8 6v1H1zm16.5-5c3.1.3 5.5 2.3 5.5 4.8V21h-4v-1c0-1.6-.6-3.2-1.5-5z" /></svg><span>Friends</span>
        </button>
        <!-- the app in use: its launcher icon (filled in by feed.ts); tapping it goes back to the launcher -->
        <button class="nav app-icon" id="navApp" type="button" title="Home screen (all apps)" aria-label="Home screen"><span class="app-tile" id="navAppTile"></span></button>
        <button class="nav" id="navInbox" type="button" title="Messages">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 4v-4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" /></svg><span>Inbox</span>
        </button>
        <button class="nav" id="navProfile" type="button" title="Sign in / account">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm-9 9c0-4 4-7 9-7s9 3 9 7v1H3z" /></svg><span id="navProfileLabel">Profile</span>
        </button>
      </nav>

      <div id="session" class="session hidden">
        <div class="session-inner">
          <div id="sessionText" class="session-text"></div>
          <div id="sessionQr" class="session-qr hidden">
            <div id="sessionNotice" class="session-notice hidden"></div>
            <!-- Code step: this form is the only thing to do (besides Cancel). It sits at the top so an
                 on-screen keyboard (Tesla) never covers the field or the Verify button. -->
            <form id="sessionCode" class="session-code hidden" autocomplete="off" novalidate>
              <label class="session-label" for="sessionCodeText">Enter the code TikTok e-mailed you</label>
              <div class="session-input">
                <input id="sessionCodeText" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="8" enterkeyhint="go" autocomplete="one-time-code" placeholder="6-digit code" aria-label="Verification code" />
                <button id="sessionCodeSend" class="btn primary" type="submit">Verify</button>
              </div>
              <div id="sessionCodeResult" class="session-code-result hidden" aria-live="polite"></div>
              <div class="session-code-foot">
                <span id="sessionCodeMeta" class="session-code-meta"></span>
                <button id="sessionCodeResend" class="btn ghost small" type="button" title="Ask TikTok to e-mail a new code (the old one stops working)">Resend code</button>
              </div>
            </form>
            <img id="sessionQrImg" alt="TikTok login QR code" draggable="false" />
            <div id="sessionQrHint" class="session-qr-hint"></div>
            <button id="sessionManualToggle" class="btn ghost small hidden" type="button">Having trouble? Show manual controls</button>
            <div id="sessionInput" class="session-manual hidden">
              <div class="session-label">Manual controls – act on TikTok's page shown above</div>
              <div class="session-input">
                <input id="sessionInputText" type="text" placeholder="Text to type into the page" />
                <button id="sessionInputType" class="btn" type="button">Type text</button>
              </div>
              <div class="session-input">
                <button id="sessionInputEnter" class="btn" type="button">Press Enter</button>
                <button id="sessionInputBack" class="btn" type="button">Delete last character</button>
              </div>
            </div>
          </div>
          <!-- Cookie sign-in (YouTube, Instagram): the cookies of a browser that is signed in, pasted or picked as a file. -->
          <form id="sessionCookies" class="session-cookies hidden" autocomplete="off" novalidate>
            <label id="sessionCookiesLabel" class="session-label" for="sessionCookiesText">Cookies of a browser that is signed in</label>
            <textarea id="sessionCookiesText" rows="5" spellcheck="false" autocapitalize="off" placeholder="Paste the contents of cookies.txt here (Netscape format, as cookie export extensions save it) – or choose the file"></textarea>
            <div class="session-input">
              <input id="sessionCookiesFile" type="file" accept=".txt,.json,text/plain,application/json" class="hidden" />
              <button id="sessionCookiesPick" class="btn" type="button">Choose cookies.txt…</button>
              <button id="sessionCookiesSend" class="btn primary" type="submit">Sign in with these cookies</button>
            </div>
            <div id="sessionCookiesResult" class="session-code-result hidden" aria-live="polite"></div>
            <details class="session-help">
              <summary>How to get the cookies</summary>
              <div id="sessionCookiesHelp"></div>
            </details>
          </form>
          <div class="session-actions">
            <button id="sessionLogin" class="btn primary" type="button">Sign in with QR code</button>
            <button id="sessionLoginWindow" class="btn" type="button" title="Opens the sign-in page in a visible browser window on the machine that runs the server">Open sign-in window on server</button>
            <button id="sessionRefresh" class="btn" type="button">Check again</button>
            <button id="sessionRestart" class="btn hidden" type="button" title="Cancel this attempt and load a fresh QR code">Start over</button>
            <button id="sessionCancel" class="btn" type="button">Cancel sign-in</button>
            <button id="sessionLogout" class="btn danger" type="button">Sign out</button>
            <button id="sessionClose" class="btn ghost" type="button">Close</button>
          </div>
        </div>
      </div>

      <!-- search -->
      <div id="search" class="panel hidden" role="dialog" aria-label="Search">
        <div class="panel-card">
          <form id="searchForm" class="panel-head" autocomplete="off">
            <button id="searchClose" class="btn ghost icon-btn" type="button" aria-label="Close">✕</button>
            <input id="searchInput" type="search" placeholder="Search videos and accounts" enterkeyhint="search" aria-label="Search" />
            <button id="searchGo" class="btn primary" type="submit">Search</button>
          </form>
          <!-- Earlier searches on this device: shown under the box while typing (filtered by what is typed);
               a row searches again, its ✕ forgets it. Filled in by social.ts. -->
          <div id="searchHistory" class="search-history hidden" role="listbox" aria-label="Earlier searches"></div>
          <div id="searchStatus" class="panel-status hidden"></div>
          <div id="searchUsers" class="user-list"></div>
          <div id="searchVideos" class="video-grid"></div>
          <div class="panel-foot search-foot">
            <!-- while earlier results are on screen: the fresh search is still running -->
            <div id="searchFresh" class="search-fresh hidden" role="status" aria-live="polite"><span class="spinner" aria-hidden="true"></span><span id="searchFreshText"></span></div>
            <button id="searchMore" class="btn hidden" type="button">More videos</button>
          </div>
        </div>
      </div>
      <!-- account profile -->
      <div id="profile" class="panel hidden" role="dialog" aria-label="Account">
        <div class="panel-card">
          <div class="panel-head">
            <button id="profileClose" class="btn ghost icon-btn" type="button" aria-label="Close">✕</button>
            <div id="profileHandle" class="panel-title">@…</div>
          </div>
          <div id="profileStatus" class="panel-status hidden"></div>
          <div class="profile-head">
            <img id="profileAvatar" class="profile-avatar" alt="" draggable="false" />
            <div class="profile-names">
              <div id="profileNick" class="profile-nick"></div>
              <div id="profileStats" class="profile-stats"></div>
            </div>
          </div>
          <div id="profileBio" class="profile-bio"></div>
          <div class="panel-actions">
            <button id="profileFollow" class="btn primary" type="button">Follow</button>
            <button id="profileMessage" class="btn" type="button">Message</button>
          </div>
          <div id="profileVideos" class="video-grid"></div>
          <div class="panel-foot"><button id="profileMore" class="btn hidden" type="button">More videos</button></div>
        </div>
      </div>
      <!-- messages -->
      <div id="inbox" class="panel hidden" role="dialog" aria-label="Messages">
        <div class="panel-card inbox-card">
          <div class="panel-head">
            <button id="inboxClose" class="btn ghost icon-btn" type="button" aria-label="Close">✕</button>
            <button id="inboxBack" class="btn ghost icon-btn hidden" type="button" aria-label="Back to the list">←</button>
            <div id="inboxTitle" class="panel-title">Messages</div>
            <button id="inboxRefresh" class="btn ghost small" type="button">Refresh</button>
          </div>
          <div id="inboxStatus" class="panel-status hidden"></div>
          <div id="inboxList" class="conv-list"></div>
          <div id="inboxThread" class="thread hidden">
            <div id="inboxMessages" class="messages"></div>
            <form id="inboxForm" class="compose" autocomplete="off">
              <input id="inboxText" type="text" maxlength="1000" placeholder="Send a message" enterkeyhint="send" aria-label="Message" />
              <button id="inboxSend" class="btn primary" type="submit">Send</button>
            </form>
          </div>
        </div>
      </div>
      <!-- Playback speed (the Speed action / S): tap a choice, or outside the card to keep the current one -->
      <div id="speed" class="speed hidden" role="dialog" aria-label="Playback speed">
        <div class="speed-card" id="speedCard">
          <div class="speed-title">Playback speed</div>
          <button class="speed-opt" type="button" data-rate="0.5">0.5×</button>
          <button class="speed-opt" type="button" data-rate="0.75">0.75×</button>
          <button class="speed-opt on" type="button" data-rate="1">1× <small>Normal</small></button>
          <button class="speed-opt" type="button" data-rate="1.25">1.25×</button>
          <button class="speed-opt" type="button" data-rate="1.5">1.5×</button>
          <button class="speed-opt" type="button" data-rate="2">2×</button>
        </div>
      </div>
      <!-- Save (the Save action / D): to the Video Library (server + this device) or as a file on this device -->
      <div id="save" class="speed hidden" role="dialog" aria-label="Save this video">
        <div class="speed-card save-card" id="saveCard">
          <div class="speed-title">Save this video</div>
          <div class="save-what" id="saveWhat"></div>
          <button class="speed-opt save-opt" type="button" id="saveLibrary"><span>Save to library</span><small id="saveLibraryNote">Kept in your Video Library · watch it any time, on every device</small></button>
          <button class="speed-opt save-opt" type="button" id="saveDevice"><span>Download to this device</span><small>An MP4 file in this browser's downloads</small></button>
          <button class="speed-opt save-opt save-cancel" type="button" id="saveCancel"><span>Cancel</span></button>
        </div>
      </div>
      <!-- kept for the handlers; the feed starts by itself (maybeAutoStart) -->
      <div id="start" class="start hidden">
        <button id="startBtn" class="start-btn" type="button">Tap to start</button>
        <p class="start-hint">Swipe or drag up/down for the next video · tap to pause · swipe right to go back · F for full screen</p>
      </div>

      <div id="toast" class="toast hidden"></div>
