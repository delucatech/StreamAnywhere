<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>StreamAnywhere – Live TV</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/src/livetv/livetv.css" />
  </head>
  <body class="tv-body">
    <!-- Opened from the home screen: the launcher's zoom splash continues here (library.html does the same). -->
    <div id="splash" class="splash hidden" aria-hidden="true">
      <div id="splashIcon" class="splash-icon"></div>
    </div>
    <script>
      try {
        var launch = JSON.parse(sessionStorage.getItem('streamanywhere.launch') || 'null');
        sessionStorage.removeItem('streamanywhere.launch');
        if (launch && launch.tile && launch.icon) {
          var splash = document.getElementById('splash');
          splash.style.background = launch.tile;
          document.getElementById('splashIcon').innerHTML = launch.icon;
          splash.classList.remove('hidden');
        }
      } catch (e) {
        /* no splash */
      }
    </script>

    <div class="wallpaper" aria-hidden="true"></div>

    <div class="page" id="page">
      <header class="topbar">
        <a id="homeLink" class="top-icon" href="home.html" aria-label="Home" title="Home">
          <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="currentColor" d="M12 3.2 2.8 11.4l1.3 1.5L5.5 11.7V20a1 1 0 0 0 1 1h4v-6h3v6h4a1 1 0 0 0 1-1v-8.3l1.4 1.2 1.3-1.5z" /></svg>
        </a>
        <h1 class="title"><span class="title-icon" id="titleIcon" aria-hidden="true"></span>Live TV</h1>
        <span class="top-group">
          <button type="button" id="refreshBtn" class="top-icon" aria-label="Refresh the channel lists" title="Refresh the channel lists">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6" /><path d="M20 4v5h-5" /></svg>
          </button>
          <button type="button" id="settingsBtn" class="top-icon" aria-label="Settings: providers" title="Settings: providers">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" /></svg>
          </button>
        </span>
      </header>

      <main class="card">
        <div class="banner hidden" id="offline" role="status">You are offline: live channels need a connection.</div>

        <!-- the last channel watched: one tap to pick it up again -->
        <div class="continue hidden" id="continue">
          <div class="continue-logo" id="continueLogo"></div>
          <div class="continue-text">
            <div class="continue-label">Continue watching</div>
            <div class="continue-name" id="continueName"></div>
            <div class="continue-now" id="continueNow"></div>
          </div>
          <button type="button" class="btn primary" id="continueBtn">Watch</button>
        </div>

        <div class="filters" id="filters">
          <input id="search" class="search" type="search" placeholder="Search channels" aria-label="Search channels" autocomplete="off" />
          <select id="providerSel" class="select" aria-label="Provider"></select>
          <!-- All channels, or only the favorites: the categories below follow the choice -->
          <div class="seg" id="viewSeg" role="radiogroup" aria-label="Show">
            <button type="button" class="seg-btn on" role="radio" aria-checked="true" data-view="all">All</button>
            <button type="button" class="seg-btn" role="radio" aria-checked="false" data-view="favs"><span class="seg-star" aria-hidden="true">★</span>Favorites <small id="favCount"></small></button>
          </div>
        </div>
        <div class="chips" id="chips" role="radiogroup" aria-label="Category"></div>
        <p class="status hidden" id="status" role="status"></p>

        <section class="grid" id="grid" aria-live="polite"></section>
        <div class="morerow hidden" id="moreRow"><button type="button" class="btn" id="moreBtn">Show more</button></div>
        <div class="empty hidden" id="empty"></div>
      </main>

      <p class="foot" id="foot">Streams come from the providers you add; whether a channel is up, allowed from here and in a format this browser plays varies by the hour. The player says what it found.</p>
    </div>

    <!-- Settings: the providers -->
    <div class="overlay hidden" id="settingsOverlay">
      <div class="sheet" role="dialog" aria-modal="true" aria-label="Settings">
        <div class="sh-head static">
          <h2 class="sh-h2">Settings</h2>
          <button type="button" class="sh-close" id="settingsClose" aria-label="Close">✕</button>
        </div>
        <div class="sh-body" id="settingsBody"></div>
      </div>
    </div>

    <!-- one provider: add / edit -->
    <div class="overlay hidden" id="formOverlay">
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="formTitle">
        <div class="sh-head static">
          <h2 class="sh-h2" id="formTitle">Add a provider</h2>
          <button type="button" class="sh-close" id="formClose" aria-label="Close">✕</button>
        </div>
        <div class="sh-body" id="formBody"></div>
      </div>
    </div>

    <div id="theater"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/src/livetv/livetv.ts"></script>
  </body>
</html>
