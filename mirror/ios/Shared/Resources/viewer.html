x:none}.lobby .status[data-kind=paired] .dot{background:var(--ok);box-shadow:0 0 #2ee6a699}.lobby .status[data-kind=error] .dot{background:#ff6b7a;animation:none}@keyframes pulse{70%{box-shadow:0 0 0 10px #ffb54700}to{box-shadow:0 0 #ffb54700}}.lobby .note{font-size:14px;margin:4px 0 12px}.manual summary{color:var(--muted);cursor:pointer;font-size:15px;margin-bottom:12px}.manual .row{max-width:420px}.manual .link{background:none;border:0;color:var(--accent);padding:10px 0;cursor:pointer;font-size:15px}@media (max-width: 760px){.lobby{grid-template-columns:1fr;justify-items:center;text-align:left;padding:22px 18px;gap:22px}.lobby-text{width:100%}}#code{flex:1;min-width:0;font:600 34px/1 ui-monospace,SF Mono,Menlo,Consolas,monospace;letter-spacing:.3em;text-transform:uppercase;text-align:center;padding:16px 12px 16px 20px;border-radius:14px;border:2px solid var(--line);background:#0c0e14;color:var(--fg)}#code:focus{outline:none;border-color:var(--accent)}.primary{padding:16px 26px;border-radius:14px;border:0;background:var(--accent);color:#fff;font-weight:700;font-size:18px;cursor:pointer}.primary:disabled{opacity:.45;cursor:default}.entry .error{color:#ff6b7a;margin:14px 0 0}.home{position:fixed;top:14px;left:14px;color:var(--muted);text-decoration:none;font-size:15px;padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.06)}.player{position:fixed;inset:0;background:#000}.stage{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden}.mirror-canvas,.mirror-video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}.overlay{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:rgba(0,0,0,.55);pointer-events:none}.overlay[hidden]{display:none}.overlay .text{font-size:28px;font-weight:600}.overlay .sub{color:var(--muted);margin-top:8px;max-width:70vw}.overlay.spin .text:before{content:"";display:inline-block;width:18px;height:18px;margin-right:12px;vertical-align:-2px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin .9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.hud{position:absolute;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;background:linear-gradient(to top,rgba(0,0,0,.75),rgba(0,0,0,0));transition:opacity .25s,transform .25s}.hud.hidden{opacity:0;transform:translateY(12px);pointer-events:none}.badge{padding:5px 10px;border-radius:999px;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:#30364a}.badge[data-path=local]{background:var(--ok);color:#04261b}.badge[data-path=direct]{background:var(--accent)}.badge[data-path=relay]{background:var(--warn);color:#2a1a00}.hud .name{font-weight:600}.hud .stats,.hud .links{color:var(--muted);font-size:13px}.hud .spacer{flex:1}.hud button{padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(20,23,32,.8);color:var(--fg);cursor:pointer}.hud button[hidden]{display:none}@media (max-width: 600px){.entry-card{padding:22px 18px}#code{font-size:26px}.primary{padding:14px 18px;font-size:16px}}
</style>
  </head>
  <body>
    <a id="home" class="home" href="home.html" hidden>‹ Home</a>

    <section id="entry" class="entry">
      <div class="entry-card">
        <h1>Mirror <small>This iPhone's screen, over its hotspot</small></h1>
        <p id="entry-note"></p>
        <div class="row">
          <input id="code" type="text" hidden aria-label="Room code" />
          <button id="watch" class="primary" type="button">Tap to watch</button>
        </div>
        <p id="entry-error" class="error" hidden></p>
      </div>
    </section>

    <section id="player" class="player" hidden>
      <div id="stage" class="stage"></div>
      <div id="overlay" class="overlay spin" hidden>
        <div id="overlay-text" class="text">Connecting…</div>
        <div id="overlay-sub" class="sub"></div>
      </div>
      <div id="hud" class="hud">
        <span id="hud-path" class="badge" data-path="local">Local</span>
        <span id="hud-name" class="name"></span>
        <span id="hud-stats" class="stats"></span>
        <span id="hud-links" class="links"></span>
        <span class="spacer"></span>
        <button id="btn-retry" type="button" hidden>Try direct link</button>
        <button id="btn-sound" type="button" aria-pressed="true">Sound on</button>
        <button id="btn-full" type="button">Full screen</button>
        <button id="btn-leave" type="button">Leave</button>
      </div>
    </section>
    
  </body>
</html>
