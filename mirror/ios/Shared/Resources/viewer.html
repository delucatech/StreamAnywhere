    <style>:root{color-scheme:dark;--bg: #07080c;--fg: #f2f4f8;--muted: #9aa3b5;--card: #141720;--line: #262b38;--accent: #4f8cff;--ok: #2ee6a6;--warn: #ffb547}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}button{font:inherit}.entry{min-height:100%;display:grid;place-items:center;padding:24px 16px}.entry-card{width:100%;max-width:520px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 28px 24px}.entry h1{margin:0 0 6px;font-size:30px;letter-spacing:.01em}.entry h1 small{display:block;font-size:15px;font-weight:400;color:var(--muted);margin-top:4px}.entry p{color:var(--muted);margin:10px 0 18px}.entry .row{display:flex;gap:12px;align-items:stretch}#code{flex:1;min-width:0;font:600 34px/1 ui-monospace,SF Mono,Menlo,Consolas,monospace;letter-spacing:.3em;text-transform:uppercase;text-align:center;padding:16px 12px 16px 20px;border-radius:14px;border:2px solid var(--line);background:#0c0e14;color:var(--fg)}#code:focus{outline:none;border-color:var(--accent)}.primary{padding:16px 26px;border-radius:14px;border:0;background:var(--accent);color:#fff;font-weight:700;font-size:18px;cursor:pointer}.primary:disabled{opacity:.45;cursor:default}.entry .error{color:#ff6b7a;margin:14px 0 0}.home{position:fixed;top:14px;left:14px;color:var(--muted);text-decoration:none;font-size:15px;padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.06)}.player{position:fixed;inset:0;background:#000}.stage{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden}.mirror-canvas,.mirror-video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}.overlay{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:rgba(0,0,0,.55);pointer-events:none}.overlay[hidden]{display:none}.overlay .text{font-size:28px;font-weight:600}.overlay .sub{color:var(--muted);marg   <body>
    <a id="home" class="home" href="home.html" hidden>‹ Home</a>

    <section id="entry" class="entry">
      <div class="entry-card">
        <h1>Mirror <small>This iPhone's screen, over its hotspot</small></h1>
        <p id="entry-note"></p>
        <div class="row">
          <input id="code" type="text" hidden aria-label="Room code" />
          <button id="watch" class="primary" type="button">Tap to watch</button>
        </div>
        <p id="entry-error" class="error" hidden></p>
      </div>
    </section>

    <section id="player" class="player" hidden>
      <div id="stage" class="stage"></div>
      <div id="overlay" class="overlay spin" hidden>
        <div id="overlay-text" class="text">Connecting…</div>
        <div id="overlay-sub" class="sub"></div>
      </div>
      <div id="hud" class="hud">
        <span id="hud-path" class="badge" data-path="local">Local</span>
        <span id="hud-name" class="name"></span>
        <span id="hud-stats" class="stats"></span>
        <span id="hud-links" class="links"></span>
        <span class="spacer"></span>
        <button id="btn-retry" type="button" hidden>Try direct link</button>
        <button id="btn-sound" type="button" aria-pressed="true">Sound on</button>
        <button id="btn-full" type="button">Full screen</button>
        <button id="btn-leave" type="button">Leave</button>
      </div>
    </section>
    
  </body>
</html>
