<?xml version="1.0" encoding="UTF-8"?>
<!-- The launch screen: the app's tile over the dark background the csproj sets (MauiSplashScreen
     Color), with three faint bars below it in the brand's colours (no text: the resizer's SVG
     renderer trips over fonts, MissingMethodException in SkiaSharp.SKTypeface.Clone). Drawn at
     BaseSize 320x320; MAUI makes the device sizes. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a3d8f"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <clipPath id="tile">
      <rect x="60" y="40" width="200" height="200" rx="44"/>
    </clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="60" y="40" width="200" height="200" fill="url(#g)"/>
    <circle cx="124" cy="182" r="44" fill="#fe2c55" opacity="0.55"/>
    <circle cx="202" cy="98" r="40" fill="#25f4ee" opacity="0.35"/>
    <path d="M133 96v88l72-44z" fill="#ffffff"/>
  </g>
  <rect x="104" y="268" width="112" height="6" rx="3" fill="#4f8cff" opacity="0.9"/>
  <rect x="124" y="282" width="72" height="4" rx="2" fill="#25f4ee" opacity="0.45"/>
  <rect x="140" y="294" width="40" height="4" rx="2" fill="#fe2c55" opacity="0.45"/>
</svg>
